<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
</head>
<body>
    <h1>Test Login Form</h1>
    <form method="POST" action="/api/auth/signin/credentials">
        <div>
            <label>Email:</label>
            <input type="text" name="email" value="admin@firma.cz" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" value="admin123" required>
        </div>
        <div>
            <label>Callback URL:</label>
            <input type="text" name="callbackUrl" value="/dashboard" required>
        </div>
        <div>
            <label>CSRF Token:</label>
            <input type="text" name="csrfToken" value="" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <script>
        // Get CSRF token first
        fetch('/api/auth/csrf')
            .then(res => res.json())
            .then(data => {
                document.querySelector('input[name="csrfToken"]').value = data.csrfToken;
            });
    </script>
</body>
</html>
